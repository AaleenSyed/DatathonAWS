<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AlphaForge AI</title>
    <script>
      // Set the theme and the page language before first paint. src/i18n.tsx keeps `lang` in sync after that.
      // Theme: the saved choice (top-bar switch, "colorTheme") wins; otherwise follow prefers-color-scheme,
      // and keep following it while the visitor has not chosen.
      var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      var saved = null;
      try {
        saved = localStorage.getItem("colorTheme");
      } catch (e) {}
      if (saved !== "light" && saved !== "dark") saved = null;
      document.documentElement.dataset.theme = saved || (mq && mq.matches ? "dark" : "light");
      if (mq && !saved && mq.addEventListener) {
        mq.addEventListener("change", function (e) {
          var s = null;
          try {
            s = localStorage.getItem("colorTheme");
          } catch (x) {}
          if (s !== "light" && s !== "dark") document.documentElement.dataset.theme = e.matches ? "dark" : "light";
        });
      }
      try {
        var l = localStorage.getItem("lang");
        if (l !== "en" && l !== "fr") l = (navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
        document.documentElement.lang = l === "fr" ? "fr-CA" : "en-CA";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
