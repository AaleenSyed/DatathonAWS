<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <style>
      .t{font-size:24px;font-weight:700;fill:#111827}
      .s{font-size:16px;fill:#4B5563}
      .lbl{font-size:15px;fill:#6B7280}
      .loop{font-size:15px;fill:#C2410C;font-weight:600}
      .llm{fill:#F1EBFD;stroke:#8B5CF6}
      .py{fill:#E8F6EE;stroke:#3F9A5B}
      .aws{fill:#FFF5E6;stroke:#E8890C}
      .app{fill:#F2F4F7;stroke:#9AA3AE}
      .box{stroke-width:2.5}
      .ln{stroke:#6B7280;stroke-width:2.5;fill:none}
      .lp{stroke:#C2410C;stroke-width:2.5;fill:none;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#111827">AlphaForge: how an answer is made</text>
  <text x="800" y="100" text-anchor="middle" font-size="20" fill="#4B5563">The AI plans and writes. Python computes. Every number is checked before you see it.</text>

  <!-- Row 1 -->
  <rect class="box app" x="60" y="170" width="240" height="120" rx="16"/>
  <text class="t" x="180" y="222" text-anchor="middle">Your question</text>
  <text class="s" x="180" y="252" text-anchor="middle">persona or custom profile</text>

  <rect class="box aws" x="370" y="170" width="240" height="120" rx="16"/>
  <text class="t" x="490" y="222" text-anchor="middle">Guardrail</text>
  <text class="s" x="490" y="252" text-anchor="middle">advice, trades, PII, attacks</text>

  <rect class="box llm" x="680" y="170" width="240" height="120" rx="16"/>
  <text class="t" x="800" y="222" text-anchor="middle">Intent router</text>
  <text class="s" x="800" y="252" text-anchor="middle">chat reply or analysis?</text>

  <rect class="box llm" x="990" y="170" width="240" height="120" rx="16"/>
  <text class="t" x="1110" y="222" text-anchor="middle">Boss agent</text>
  <text class="s" x="1110" y="252" text-anchor="middle">picks tools, builds the plan</text>

  <rect class="box py" x="1300" y="170" width="240" height="120" rx="16"/>
  <text class="t" x="1420" y="214" text-anchor="middle">Workers</text>
  <text class="s" x="1420" y="242" text-anchor="middle">risk, 2022 stress, cycle,</text>
  <text class="s" x="1420" y="264" text-anchor="middle">suitability · no LLM</text>

  <line class="ln" x1="300" y1="230" x2="366" y2="230" marker-end="url(#a)"/>
  <line class="ln" x1="610" y1="230" x2="676" y2="230" marker-end="url(#a)"/>
  <line class="ln" x1="920" y1="230" x2="986" y2="230" marker-end="url(#a)"/>
  <line class="ln" x1="1230" y1="230" x2="1296" y2="230" marker-end="url(#a)"/>
  <line class="ln" x1="1420" y1="290" x2="1420" y2="466" marker-end="url(#a)"/>
  <text class="lbl" x="1432" y="384">results</text>

  <!-- Row 2 (right to left) -->
  <rect class="box py" x="1300" y="470" width="240" height="120" rx="16"/>
  <text class="t" x="1420" y="514" text-anchor="middle">Reviewer</text>
  <text class="s" x="1420" y="542" text-anchor="middle">sources, periods, limits,</text>
  <text class="s" x="1420" y="564" text-anchor="middle">no look-ahead</text>

  <rect class="box llm" x="990" y="470" width="240" height="120" rx="16"/>
  <text class="t" x="1110" y="514" text-anchor="middle">Presenter</text>
  <text class="s" x="1110" y="542" text-anchor="middle">writes from worker results,</text>
  <text class="s" x="1110" y="564" text-anchor="middle">summary first, streamed</text>

  <rect class="box py" x="680" y="470" width="240" height="120" rx="16"/>
  <text class="t" x="800" y="514" text-anchor="middle">Answer check</text>
  <text class="s" x="800" y="542" text-anchor="middle">every number must exist</text>
  <text class="s" x="800" y="564" text-anchor="middle">in the cited step</text>

  <rect class="box aws" x="370" y="470" width="240" height="120" rx="16"/>
  <text class="t" x="490" y="522" text-anchor="middle">Guardrail</text>
  <text class="s" x="490" y="552" text-anchor="middle">checks the final answer</text>

  <rect class="box app" x="60" y="470" width="240" height="120" rx="16"/>
  <text class="t" x="180" y="514" text-anchor="middle">Answer + proof</text>
  <text class="s" x="180" y="542" text-anchor="middle">sources, charts,</text>
  <text class="s" x="180" y="564" text-anchor="middle">full trace</text>

  <line class="ln" x1="1300" y1="530" x2="1234" y2="530" marker-end="url(#a)"/>
  <text class="lbl" x="1267" y="520" text-anchor="middle">pass</text>
  <line class="ln" x1="990" y1="530" x2="924" y2="530" marker-end="url(#a)"/>
  <line class="ln" x1="680" y1="530" x2="614" y2="530" marker-end="url(#a)"/>
  <line class="ln" x1="370" y1="530" x2="304" y2="530" marker-end="url(#a)"/>

  <!-- Loops -->
  <path class="lp" d="M1340,470 L1340,390 L1150,390 L1150,294" marker-end="url(#r)"/>
  <text class="loop" x="1245" y="380" text-anchor="middle">incomplete → redo (max 2)</text>
  <path class="lp" d="M800,590 L800,640 L1110,640 L1110,594" marker-end="url(#r)"/>
  <text class="loop" x="955" y="664" text-anchor="middle">number not found → rewrite (1×)</text>

  <!-- AWS band -->
  <rect x="60" y="700" width="1480" height="160" rx="18" fill="#FFFBF5" stroke="#E8890C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="84" y="732" font-size="17" font-weight="700" fill="#C2410C">AWS · us-east-1</text>

  <rect class="box aws" x="100" y="750" width="440" height="90" rx="14"/>
  <text class="t" x="320" y="788" text-anchor="middle">Amazon Bedrock</text>
  <text class="s" x="320" y="816" text-anchor="middle">Claude Haiku 4.5 (router, boss) · Sonnet 4.6 (presenter)</text>

  <rect class="box aws" x="580" y="750" width="440" height="90" rx="14"/>
  <text class="t" x="800" y="788" text-anchor="middle">Amazon Bedrock Guardrails</text>
  <text class="s" x="800" y="816" text-anchor="middle">on every question and every answer</text>

  <rect class="box aws" x="1060" y="750" width="440" height="90" rx="14"/>
  <text class="t" x="1280" y="788" text-anchor="middle">Amazon S3</text>
  <text class="s" x="1280" y="816" text-anchor="middle">market data · trace of every answer · eval results</text>

  <!-- Legend -->
  <rect class="llm" x="1150" y="128" width="18" height="18" rx="4" stroke-width="2"/>
  <text class="lbl" x="1176" y="143">AI on Bedrock</text>
  <rect class="py" x="1290" y="128" width="18" height="18" rx="4" stroke-width="2"/>
  <text class="lbl" x="1316" y="143">Python (tested)</text>
  <rect class="aws" x="1436" y="128" width="18" height="18" rx="4" stroke-width="2"/>
  <text class="lbl" x="1462" y="143">AWS safety</text>
</svg>
