openapi: 3.1.0
info:
  title: AlphaForge AI Chat API
  version: 0.3.1
  description: |
    REST API for the AlphaForge AI chat assistant (personas, conversations, history, auth helpers).
    Streaming chat runs over WebSocket and is described in `asyncapi.yaml`.
    The WebSocket message payloads are defined here, under `components/schemas`
    (WsClientMessage / WsServerMessage), so both specs share one source of truth.

    **The backend owns the data shapes.** Every analysis field mirrors the Python pipeline
    (`pipeline.py`, `run_trace.py`, `workers/`) and is built by `server/explainer.py`.
    Numbers are fractions (0.15 = 15%), in CAD unless the trace says otherwise.
    Rule codes, statuses, actors and tool names are codes; clients translate them for display.

    Sign-up, sign-in, password reset and token refresh are handled directly by
    Amazon Cognito, not by this API. Clients send the Cognito **ID token** as a Bearer token.
    Without Cognito settings the server runs in dev mode (any token, or none, is accepted).

    Simulation only. No real transactions. Never personalized financial advice.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Personas
  - name: Profiles
  - name: Conversations
  - name: Messages

paths:
  /health:
    get:
      tags: [Session]
      operationId: getHealth
      summary: Liveness check (no auth)
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Current user (from the Cognito token)
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws-ticket:
    post:
      tags: [Session]
      operationId: createWsTicket
      summary: Get a short-lived, single-use ticket to open the WebSocket
      description: |
        Browsers cannot set an Authorization header on a WebSocket. The client exchanges
        its Cognito token for a ticket (valid 30 seconds, single use) and connects with
        `wss://host/ws?ticket=<ticket>`.
      responses:
        "200":
          description: Ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WsTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /personas:
    get:
      tags: [Personas]
      operationId: listPersonas
      summary: The fictional investor personas and their assumed limits (from personas.py)
      responses:
        "200":
          description: Every persona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles:
    post:
      tags: [Profiles]
      operationId: createProfile
      summary: Build a fictional profile from the 7-question questionnaire (profile_builder.py, no LLM)
      description: |
        Deterministic: questions 1-4 give a risk level (low, low-moderate, moderate, high), a fixed table gives
        its limits, then questions 5-7 adjust them (crypto cap, ESG review, preferences); a horizon under 3 years
        raises the bonds/cash minimum to 60%. No personal data is asked. The profile is registered under
        `custom-<8 chars>` and can be used as a `personaId` by the user who created it. Profiles live in server
        memory. `limitReasons` sentences are written in `language`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string, pattern: "^custom-[a-z0-9]{8}$" }
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: One of the caller's custom profiles
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List the user's conversations, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `nextCursor`
          schema: { type: string }
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get one conversation
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Rename a conversation, switch the active branch or change the answer language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation and all its messages
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: All messages of a conversation, including every branch
      description: |
        Messages form a tree through `parentId`. Editing a user message or regenerating
        a reply adds a sibling; nothing is overwritten. The branch the user is viewing
        ends at `Conversation.activeLeafId`.
      responses:
        "200":
          description: Every message in the conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito user pool ID token.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or not owned by the caller)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [unauthorized, not_found, invalid_request, internal_error]
        message: { type: string }

    Health:
      type: object
      required: [status, agentMode, authMode]
      properties:
        status: { const: ok }
        agentMode:
          type: string
          enum: [bedrock, demo]
          description: "`demo` = scripted boss and presenter (no LLM) for UI work; numbers still come from the real workers."
        authMode: { type: string, enum: [cognito, dev] }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, description: Cognito `sub` claim }
        email: { type: string, format: email }

    WsTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }

    Language:
      type: string
      enum: [en, fr]
      description: Answer language. `fr` = Canadian French.

    PersonaId:
      type: string
      pattern: "^(amira|mateo|robert|custom-[a-z0-9]{8})$"
      description: |
        Fictional investor persona the conversation is about: a built-in persona (amira, mateo, robert) or a
        profile the user built with POST /profiles (custom-<8 chars>, usable only by that user).

    Persona:
      type: object
      description: |
        One persona from personas.py, or a custom profile from POST /profiles (same fields, plus `limitReasons`;
        `age` and `occupation` are null because the questionnaire asks no personal data). Profiles are fictional;
        numeric limits are team assumptions.
      required: [id, name, age, occupation, riskTolerance, horizonYears, goal, preferences, limits, esgReviewTickers, source]
      properties:
        id: { $ref: "#/components/schemas/PersonaId" }
        name: { type: string }
        age: { type: [integer, "null"] }
        occupation: { type: [string, "null"] }
        riskTolerance:
          type: string
          examples: [high, moderate, low-moderate, low]
        horizonYears: { type: string, examples: ["15+", "8-12", "3-5", "<3"] }
        goal: { type: string }
        preferences:
          type: array
          items: { type: string }
        limits:
          type: object
          description: |
            Rule code -> limit, as in personas.py. Fractions (0.15 = 15%), except `min_asset_classes` (a count)
            and `sector_max` (sector name -> fraction).
          additionalProperties: true
          examples: [{ crypto_max: 0.15, single_stock_max: 0.15, sector_max: { Information Technology: 0.5 }, min_asset_classes: 3 }]
        esgReviewTickers:
          type: array
          items: { type: string }
        source: { type: string }
        limitReasons:
          type: object
          description: Custom profiles only. Rule code (as in `limits`, plus `esg_review`) -> why, and which questions caused it.
          additionalProperties: { $ref: "#/components/schemas/LimitReason" }

    LimitReason:
      type: object
      required: [text, questions]
      additionalProperties: false
      properties:
        text: { type: string, description: One sentence, in the language of the request }
        questions:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }

    ProfileAnswers:
      type: object
      description: The 7 questionnaire answers. Multiple choice only; no name, age or amounts.
      required: [goal, horizon, drop25, liquidity, crypto, esg, industries]
      additionalProperties: false
      properties:
        goal: { type: string, enum: [preserve, income, balanced, growth], description: "Q1 main goal" }
        horizon: { type: string, enum: [lt3, 3to5, 5to10, 10plus], description: "Q2 years before the money is needed" }
        drop25: { type: string, enum: [sell_all, sell_some, hold, buy_more], description: "Q3 reaction to a 25% drop" }
        liquidity: { type: string, enum: [high, some, low, none], description: "Q4 need for cash in the next 2 years" }
        crypto: { type: string, enum: [none, small, significant], description: "Q5 interest in crypto" }
        esg: { type: string, enum: [not_important, prefer, strict], description: "Q6 importance of ESG" }
        industries:
          type: array
          description: "Q7 industries of interest (industry sector groups of the universe; may be empty)"
          items: { type: string }

    CreateProfileRequest:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers: { $ref: "#/components/schemas/ProfileAnswers" }
        language: { $ref: "#/components/schemas/Language" }

    PersonaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Persona" }

    Conversation:
      type: object
      required: [id, title, personaId, language, activeLeafId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        personaId: { $ref: "#/components/schemas/PersonaId" }
        language: { $ref: "#/components/schemas/Language" }
        activeLeafId:
          type: [string, "null"]
          format: uuid
          description: Last message of the branch currently shown. Null while empty.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: [string, "null"] }

    CreateConversationRequest:
      type: object
      required: [personaId]
      additionalProperties: false
      properties:
        personaId: { $ref: "#/components/schemas/PersonaId" }
        title: { type: string, minLength: 1, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }

    UpdateConversationRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        activeLeafId:
          type: string
          format: uuid
          description: Switch to another branch by selecting its last message.
        language: { $ref: "#/components/schemas/Language" }

    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }

    MessageRole:
      type: string
      enum: [user, assistant]

    MessageStatus:
      type: string
      enum: [streaming, complete, cancelled, error]

    Message:
      type: object
      required: [id, conversationId, parentId, role, content, status, language, trace, final, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: Previous message in this branch. Null for the first message.
        role: { $ref: "#/components/schemas/MessageRole" }
        content:
          type: string
          description: |
            Markdown. Assistant answers carry claim tags written by the presenter:
            `[fact: step N]` (N = TraceStep.step, several allowed: `[fact: step 3, 7]`), `[assumption]`, `[scenario]`.
        status: { $ref: "#/components/schemas/MessageStatus" }
        language: { $ref: "#/components/schemas/Language" }
        trace:
          type: array
          description: Every step of the run (assistant messages only; empty for user messages).
          items: { $ref: "#/components/schemas/TraceStep" }
        final:
          oneOf:
            - $ref: "#/components/schemas/ExplainerPayload"
            - type: "null"
          description: >-
            Structured explanation attached to completed assistant messages. Null for short replies (greeting,
            question about the assistant, off-topic message): no analysis ran, the trace has only the user, router and pipeline steps.
        createdAt: { type: string, format: date-time }

    TraceStep:
      type: object
      description: One step of the run trace (run_trace.py), the explainability evidence.
      required: [step, actor, action, input, output, outputSummary, timestamp]
      properties:
        step: { type: integer, minimum: 1, description: "Number cited by `[fact: step N]`." }
        actor:
          type: string
          description: Who did it.
          examples: [user, boss, "worker:risk_analyst", "worker:suitability", "worker:market_context", "worker:data_retriever", reviewer, presenter, pipeline, guardrail, router]
        action:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          examples: [question, route, plan, analyze_asset, analyze_sector, stress_test_2022, check_suitability, cycle_phase, review_work, write_answer, check_answer, final_answer]
        input: { description: Arguments of the step (any JSON). }
        output:
          description: |
            Result (any JSON). Worker results follow AGENT_GUARDRAILS.md: `status`, `data`, `source`, `period`,
            `currency`, `warnings` (or `status: error` + `error`).
        outputSummary: { type: string }
        timestamp: { type: string, format: date-time }

    SuitabilityStatus:
      type: string
      enum: [conflict, flag, info, pass, not_applicable, not_evaluated]
      description: |
        conflict = hard rule broken at the proposed weight; flag = above a portfolio-level limit on its own, or needs
        review; info = portfolio-level reminder (a minimum to fill, or a cap to respect when no weight is proposed);
        pass = within the limit; not_applicable; not_evaluated = data missing.

    SuitabilityOverall:
      type: string
      enum: [conflict, flag, incomplete, pass]

    SuitabilityCheck:
      type: object
      required: [rule, status, limit, value, explanation]
      properties:
        rule: { type: string, examples: [crypto_max, single_stock_max, sector_max, min_asset_classes, vol_max, bonds_min, bonds_cash_min, stress_2022_max_drawdown, esg_review] }
        status: { $ref: "#/components/schemas/SuitabilityStatus" }
        limit:
          description: Fraction, count, object (sector -> fraction) or list (ESG tickers), as in personas.py.
        value:
          description: Fraction, count, object (ticker -> fraction), list or null.
        explanation: { type: string, description: Written by the suitability worker (English). }

    SuitabilityResult:
      type: object
      required: [target, targetKind, proposedWeight, overall, checks, traceStep]
      properties:
        target: { type: string }
        targetKind: { $ref: "#/components/schemas/TargetKind" }
        proposedWeight: { type: [number, "null"], description: "Fraction of the portfolio, e.g. 0.5" }
        overall: { $ref: "#/components/schemas/SuitabilityOverall" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/SuitabilityCheck" }
        traceStep: { type: integer }

    TargetKind:
      type: string
      enum: [asset, industry, building_block]
      description: industry = all-equity sector group (equal-weight basket); building_block = ETFs or crypto (no blended figure).

    Member:
      type: object
      required: [ticker, name, assetClass]
      properties:
        ticker: { type: string }
        name: { type: string }
        assetClass: { type: string, examples: [equity, etf_bond, etf_equity, etf_commodity, crypto] }

    MetricRange:
      type: object
      required: [min, minTicker, max, maxTicker]
      properties:
        min: { type: number }
        minTicker: { type: string }
        max: { type: number }
        maxTicker: { type: string }

    TargetSummary:
      type: object
      description: A requested target or a recommended sector group, with its key numbers from the trace.
      required: [name, kind, members, riskLabel, annualizedVol, maxDrawdown, totalReturn, range, suitabilityOverall, momentum12m, trend, period, currency, traceSteps]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/TargetKind" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        riskLabel: { type: [string, "null"], examples: [Low, Moderate, High, Very High] }
        annualizedVol: { type: [number, "null"] }
        maxDrawdown: { type: [number, "null"] }
        totalReturn: { type: [number, "null"] }
        range:
          description: Building blocks only (no blended figure) - min and max over the members.
          oneOf:
            - type: object
              required: [annualizedVol, maxDrawdown, totalReturn]
              properties:
                annualizedVol: { $ref: "#/components/schemas/MetricRange" }
                maxDrawdown: { $ref: "#/components/schemas/MetricRange" }
                totalReturn: { $ref: "#/components/schemas/MetricRange" }
            - type: "null"
        suitabilityOverall:
          oneOf:
            - $ref: "#/components/schemas/SuitabilityOverall"
            - type: "null"
        momentum12m: { type: [number, "null"] }
        trend: { type: [string, "null"], examples: [above 200-day average, below 200-day average] }
        period:
          oneOf:
            - $ref: "#/components/schemas/Period"
            - type: "null"
        currency: { type: [string, "null"] }
        traceSteps:
          type: array
          items: { type: integer }

    Period:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }

    RiskRow:
      type: object
      description: One bar in the risk charts. Building blocks are split into one row per member.
      required: [name, group, kind, annualizedVol, maxDrawdown, totalReturn, riskLabel, stress2022Return, stress2022MaxDrawdown, traceSteps]
      properties:
        name: { type: string, description: Ticker, or sector group for an industry basket }
        group: { type: string, description: The requested target or recommended sector this row belongs to }
        kind: { $ref: "#/components/schemas/TargetKind" }
        annualizedVol: { type: [number, "null"] }
        maxDrawdown: { type: [number, "null"] }
        totalReturn: { type: [number, "null"] }
        riskLabel: { type: [string, "null"] }
        stress2022Return: { type: [number, "null"] }
        stress2022MaxDrawdown: { type: [number, "null"] }
        traceSteps:
          type: array
          items: { type: integer }

    MarketContext:
      type: object
      required: [asOf, phase, ruleFired, sectorTilt, vix, mood, creditSpreadRising, consumerSentiment, traceSteps]
      properties:
        asOf: { type: string, format: date }
        phase: { type: [string, "null"], examples: [Recession risk, Early cycle, Mid cycle, Late cycle] }
        ruleFired: { type: [string, "null"] }
        sectorTilt:
          type: array
          items: { type: string }
        vix: { type: [number, "null"] }
        mood: { type: [string, "null"], examples: [calm/hope, normal, fear] }
        creditSpreadRising: { type: [boolean, "null"] }
        consumerSentiment: { type: [number, "null"] }
        traceSteps:
          type: array
          items: { type: integer }

    ClaimKind:
      type: string
      enum: [fact, assumption, scenario]

    Claim:
      type: object
      description: A tagged sentence of the answer (parsed from the markdown tags).
      required: [text, kind, traceSteps, sources]
      properties:
        text: { type: string, description: Sentence without the tag }
        kind: { $ref: "#/components/schemas/ClaimKind" }
        traceSteps:
          type: array
          description: Steps cited by a fact.
          items: { type: integer }
        sources:
          type: array
          description: Source, period and currency of each cited step.
          items: { type: string }

    Verdict:
      type: object
      required: [verdict, reasons]
      properties:
        verdict: { type: string, enum: [pass, fail] }
        reasons:
          type: array
          items: { type: string }

    Review:
      type: object
      required: [work, answer, workRetries, answerRetries, incomplete]
      properties:
        work: { $ref: "#/components/schemas/Verdict" }
        answer: { $ref: "#/components/schemas/Verdict" }
        workRetries: { type: integer, minimum: 0, description: Times the reviewer sent the plan back to the boss }
        answerRetries: { type: integer, minimum: 0, description: Times the reviewer sent the answer back to the presenter }
        incomplete: { type: boolean, description: True when the work still failed after the retries }

    Caveat:
      type: string
      enum: [simulation_only, survivorship_bias, fred_revised_vintages, equal_weight_baskets, past_performance, macro_publication_lag]
      description: Fixed data caveats (README); clients show a translated sentence.

    RunInfo:
      type: object
      required: [runId, sessionId, analysisDate, s3Uri]
      properties:
        runId: { type: string }
        sessionId: { type: [string, "null"] }
        analysisDate: { type: string, format: date }
        s3Uri: { type: [string, "null"], description: "Trace JSON in S3 (s3://$DATA_BUCKET/runs/...)" }

    ExplainerPayload:
      type: object
      description: |
        Final structured explanation, built deterministically from the run trace by server/explainer.py.
        Every number here also appears in a trace step (see traceSteps).
      required: [language, persona, recommendedSectors, requestedTargets, conflicts, suitability, riskTable, personaLimits, marketContext, claims, review, limitations, caveats, run]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        persona:
          type: object
          required: [id, name]
          properties:
            id: { $ref: "#/components/schemas/PersonaId" }
            name: { type: string }
        recommendedSectors:
          type: array
          description: 1-2 sector groups the boss recommends for the persona (the main answer).
          items: { $ref: "#/components/schemas/TargetSummary" }
        requestedTargets:
          type: array
          description: Tickers or sector groups the user asked about.
          items: { $ref: "#/components/schemas/TargetSummary" }
        conflicts:
          type: array
          description: Conflicts between the request and the persona, as noted by the boss.
          items: { type: string }
        suitability:
          type: array
          items: { $ref: "#/components/schemas/SuitabilityResult" }
        riskTable:
          type: array
          items: { $ref: "#/components/schemas/RiskRow" }
        personaLimits:
          type: object
          additionalProperties: true
          description: The persona's limits (personas.py), for chart reference lines.
        marketContext:
          oneOf:
            - $ref: "#/components/schemas/MarketContext"
            - type: "null"
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        review: { $ref: "#/components/schemas/Review" }
        limitations:
          type: array
          description: Warnings from the worker results (deduplicated).
          items: { type: string }
        caveats:
          type: array
          items: { $ref: "#/components/schemas/Caveat" }
        run: { $ref: "#/components/schemas/RunInfo" }

    GenerationStage:
      type: string
      enum: [queued, planning, analyzing, reviewing, writing, checking, done]
      description: |
        queued = waiting for another run to finish; planning = boss is choosing tools; analyzing = workers ran;
        reviewing = reviewer checks the work; writing = presenter writes; checking = reviewer checks the answer. Short replies go straight to done (they may briefly show queued or planning first).

    # ---------------------------------------------------------------------
    # WebSocket payloads (used by asyncapi.yaml). Discriminated by `type`.
    # ---------------------------------------------------------------------
    WsMessageSend:
      type: object
      required: [type, conversationId, text]
      properties:
        type: { const: message.send }
        requestId: { type: string, description: Echoed back in events for correlation }
        conversationId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: Defaults to the conversation's activeLeafId. Must be an assistant message (or null).
        text: { type: string, minLength: 1, maxLength: 8000 }
        language: { $ref: "#/components/schemas/Language" }

    WsMessageEdit:
      type: object
      description: Creates a new user message that is a sibling of `messageId`, then a new reply.
      required: [type, conversationId, messageId, text]
      properties:
        type: { const: message.edit }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid, description: User message being edited }
        text: { type: string, minLength: 1, maxLength: 8000 }
        language: { $ref: "#/components/schemas/Language" }

    WsMessageRegenerate:
      type: object
      description: Creates a new assistant reply as a sibling of `messageId`.
      required: [type, conversationId, messageId]
      properties:
        type: { const: message.regenerate }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid, description: Assistant message to redo }
        language: { $ref: "#/components/schemas/Language" }

    WsGenerationCancel:
      type: object
      required: [type, conversationId]
      properties:
        type: { const: generation.cancel }
        conversationId: { type: string, format: uuid }

    WsPing:
      type: object
      required: [type]
      properties:
        type: { const: ping }

    WsClientMessage:
      description: Any message a client may send.
      oneOf:
        - $ref: "#/components/schemas/WsMessageSend"
        - $ref: "#/components/schemas/WsMessageEdit"
        - $ref: "#/components/schemas/WsMessageRegenerate"
        - $ref: "#/components/schemas/WsGenerationCancel"
        - $ref: "#/components/schemas/WsPing"
      discriminator:
        propertyName: type
        mapping:
          message.send: "#/components/schemas/WsMessageSend"
          message.edit: "#/components/schemas/WsMessageEdit"
          message.regenerate: "#/components/schemas/WsMessageRegenerate"
          generation.cancel: "#/components/schemas/WsGenerationCancel"
          ping: "#/components/schemas/WsPing"

    WsMessageStart:
      type: object
      description: |
        A new assistant message begins. When the request created a user message
        (send / edit), it is included so the client can show it with its real id.
      required: [type, conversationId, message]
      properties:
        type: { const: message.start }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        userMessage: { $ref: "#/components/schemas/Message" }
        message:
          $ref: "#/components/schemas/Message"

    WsGenerationStatus:
      type: object
      description: Progress of the running generation (a run takes about a minute).
      required: [type, conversationId, messageId, stage, steps]
      properties:
        type: { const: generation.status }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/GenerationStage" }
        steps: { type: integer, minimum: 0, description: Trace steps so far }

    WsTraceStep:
      type: object
      description: A new step of the run trace, sent as soon as it happens.
      required: [type, conversationId, messageId, step]
      properties:
        type: { const: trace.step }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        step: { $ref: "#/components/schemas/TraceStep" }

    WsMessageDelta:
      type: object
      description: |
        Text to append to the message, streamed as the presenter writes it (many small deltas). The demo agent
        sends the whole answer as one delta. With `reset: true`, first discard the text received so far
        (the reviewer rejected a draft, or the pipeline rewrote the text), then append `delta`.
      required: [type, conversationId, messageId, delta]
      properties:
        type: { const: message.delta }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        delta: { type: string, description: Text chunk to append }
        reset: { type: boolean, description: "Discard the text received so far before appending delta" }

    WsMessageEnd:
      type: object
      required: [type, conversationId, message]
      properties:
        type: { const: message.end }
        conversationId: { type: string, format: uuid }
        message:
          $ref: "#/components/schemas/Message"

    WsError:
      type: object
      required: [type, code, message]
      properties:
        type: { const: error }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        code:
          type: string
          examples: [invalid_message, not_found, busy, agent_error, internal_error]
        message: { type: string }

    WsPong:
      type: object
      required: [type]
      properties:
        type: { const: pong }

    WsServerMessage:
      description: Any message the server may send.
      oneOf:
        - $ref: "#/components/schemas/WsMessageStart"
        - $ref: "#/components/schemas/WsGenerationStatus"
        - $ref: "#/components/schemas/WsTraceStep"
        - $ref: "#/components/schemas/WsMessageDelta"
        - $ref: "#/components/schemas/WsMessageEnd"
        - $ref: "#/components/schemas/WsError"
        - $ref: "#/components/schemas/WsPong"
      discriminator:
        propertyName: type
        mapping:
          message.start: "#/components/schemas/WsMessageStart"
          generation.status: "#/components/schemas/WsGenerationStatus"
          trace.step: "#/components/schemas/WsTraceStep"
          message.delta: "#/components/schemas/WsMessageDelta"
          message.end: "#/components/schemas/WsMessageEnd"
          error: "#/components/schemas/WsError"
          pong: "#/components/schemas/WsPong"
