openapi: 3.1.0
info:
  title: AlphaForge AI Chat API
  version: 0.1.0
  description: |
    REST API for the AlphaForge AI chat assistant (conversations, history, auth helpers).
    Streaming chat runs over WebSocket and is described in `asyncapi.yaml`.
    The WebSocket message payloads are defined here, under `components/schemas`
    (WsClientMessage / WsServerMessage), so both specs share one source of truth.

    Sign-up, sign-in, password reset and token refresh are handled directly by
    Amazon Cognito (Amplify Auth or OIDC with PKCE), not by this API. Clients send the
    Cognito **ID token** as a Bearer token.

    Simulation only. No real transactions. Never personalized financial advice.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Conversations
  - name: Messages

paths:
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Current user (from the Cognito token)
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws-ticket:
    post:
      tags: [Session]
      operationId: createWsTicket
      summary: Get a short-lived, single-use ticket to open the WebSocket
      description: |
        Browsers cannot set an Authorization header on a WebSocket. The client exchanges
        its Cognito token for a ticket (valid 30 seconds, single use) and connects with
        `wss://host/ws?ticket=<ticket>`.
      responses:
        "200":
          description: Ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WsTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List the user's conversations, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `nextCursor`
          schema: { type: string }
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get one conversation
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Rename a conversation or switch the active branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation and all its messages
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: All messages of a conversation, including every branch
      description: |
        Messages form a tree through `parentId`. Editing a user message or regenerating
        a reply adds a sibling; nothing is overwritten. The branch the user is viewing
        ends at `Conversation.activeLeafId`.
      responses:
        "200":
          description: Every message in the conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito user pool ID token.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or not owned by the caller)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [unauthorized, not_found, invalid_request, internal_error]
        message: { type: string }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, description: Cognito `sub` claim }
        email: { type: string, format: email }

    WsTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }

    PersonaId:
      type: string
      enum: [amira, mateo, robert]
      description: Fictional investor persona the conversation is about.

    Conversation:
      type: object
      required: [id, title, personaId, activeLeafId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        personaId: { $ref: "#/components/schemas/PersonaId" }
        activeLeafId:
          type: [string, "null"]
          format: uuid
          description: Last message of the branch currently shown. Null while empty.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: [string, "null"] }

    CreateConversationRequest:
      type: object
      required: [personaId]
      properties:
        personaId: { $ref: "#/components/schemas/PersonaId" }
        title: { type: string, maxLength: 120 }

    UpdateConversationRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 120 }
        activeLeafId:
          type: string
          format: uuid
          description: Switch to another branch by selecting its last message.

    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }

    MessageRole:
      type: string
      enum: [user, assistant]

    MessageStatus:
      type: string
      enum: [streaming, complete, cancelled, error]

    Message:
      type: object
      required: [id, conversationId, parentId, role, content, status, toolCalls, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: Previous message in this branch. Null for the first message.
        role: { $ref: "#/components/schemas/MessageRole" }
        content: { type: string, description: Plain or markdown text }
        status: { $ref: "#/components/schemas/MessageStatus" }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        final:
          oneOf:
            - $ref: "#/components/schemas/ExplainerPayload"
            - type: "null"
          description: Structured explanation attached to completed assistant messages.
        createdAt: { type: string, format: date-time }

    ToolCall:
      type: object
      required: [id, name, arguments, status]
      properties:
        id: { type: string, description: Trace step id; claims reference it }
        name: { type: string, pattern: "^[a-zA-Z0-9_-]+$" }
        arguments:
          type: object
          additionalProperties: true
        status: { type: string, enum: [running, ok, error] }
        result:
          type: object
          additionalProperties: true
          description: |
            Tool output. By convention includes `source` and the date range actually used.

    ClaimKind:
      type: string
      enum: [fact, assumption, scenario]

    Claim:
      type: object
      required: [text, kind]
      properties:
        text: { type: string }
        kind: { $ref: "#/components/schemas/ClaimKind" }
        source:
          type: string
          description: Required for `fact` claims (dataset, URL, period, currency).
        traceStepId:
          type: string
          description: ToolCall.id that produced the number.

    GovernanceResult:
      type: object
      required: [rule, status]
      properties:
        rule: { type: string, examples: ["crypto <= 15%"] }
        status: { type: string, enum: [pass, flag] }
        value: { type: [number, "null"] }
        limit: { type: [number, "null"] }
        note: { type: string }

    ExplainerPayload:
      type: object
      description: Final structured answer produced by the agent's explainer step.
      required: [summary, claims, governance, limitations]
      properties:
        summary: { type: string }
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        governance:
          type: array
          items: { $ref: "#/components/schemas/GovernanceResult" }
        limitations:
          type: array
          items: { type: string }

    # ---------------------------------------------------------------------
    # WebSocket payloads (used by asyncapi.yaml). Discriminated by `type`.
    # ---------------------------------------------------------------------
    WsMessageSend:
      type: object
      required: [type, conversationId, text]
      properties:
        type: { const: message.send }
        requestId: { type: string, description: Echoed back in events for correlation }
        conversationId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: Defaults to the conversation's activeLeafId.
        text: { type: string, minLength: 1, maxLength: 8000 }

    WsMessageEdit:
      type: object
      description: Creates a new user message that is a sibling of `messageId`, then a new reply.
      required: [type, conversationId, messageId, text]
      properties:
        type: { const: message.edit }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid, description: User message being edited }
        text: { type: string, minLength: 1, maxLength: 8000 }

    WsMessageRegenerate:
      type: object
      description: Creates a new assistant reply as a sibling of `messageId`.
      required: [type, conversationId, messageId]
      properties:
        type: { const: message.regenerate }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid, description: Assistant message to redo }

    WsGenerationCancel:
      type: object
      required: [type, conversationId]
      properties:
        type: { const: generation.cancel }
        conversationId: { type: string, format: uuid }

    WsPing:
      type: object
      required: [type]
      properties:
        type: { const: ping }

    WsClientMessage:
      description: Any message a client may send.
      oneOf:
        - $ref: "#/components/schemas/WsMessageSend"
        - $ref: "#/components/schemas/WsMessageEdit"
        - $ref: "#/components/schemas/WsMessageRegenerate"
        - $ref: "#/components/schemas/WsGenerationCancel"
        - $ref: "#/components/schemas/WsPing"
      discriminator:
        propertyName: type
        mapping:
          message.send: "#/components/schemas/WsMessageSend"
          message.edit: "#/components/schemas/WsMessageEdit"
          message.regenerate: "#/components/schemas/WsMessageRegenerate"
          generation.cancel: "#/components/schemas/WsGenerationCancel"
          ping: "#/components/schemas/WsPing"

    WsMessageStart:
      type: object
      description: |
        A new assistant message begins. When the request created a user message
        (send / edit), it is included so the client can show it with its real id.
      required: [type, conversationId, message]
      properties:
        type: { const: message.start }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        userMessage: { $ref: "#/components/schemas/Message" }
        message:
          $ref: "#/components/schemas/Message"

    WsMessageDelta:
      type: object
      required: [type, conversationId, messageId, delta]
      properties:
        type: { const: message.delta }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        delta: { type: string, description: Text chunk to append }

    WsToolCall:
      type: object
      required: [type, conversationId, messageId, toolCall]
      properties:
        type: { const: tool.call }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        toolCall: { $ref: "#/components/schemas/ToolCall" }

    WsToolResult:
      type: object
      required: [type, conversationId, messageId, toolCall]
      properties:
        type: { const: tool.result }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        toolCall:
          $ref: "#/components/schemas/ToolCall"

    WsMessageEnd:
      type: object
      required: [type, conversationId, message]
      properties:
        type: { const: message.end }
        conversationId: { type: string, format: uuid }
        message:
          $ref: "#/components/schemas/Message"

    WsError:
      type: object
      required: [type, code, message]
      properties:
        type: { const: error }
        requestId: { type: string }
        conversationId: { type: string, format: uuid }
        code:
          type: string
          examples: [invalid_message, not_found, rate_limited, agent_error, internal_error]
        message: { type: string }

    WsPong:
      type: object
      required: [type]
      properties:
        type: { const: pong }

    WsServerMessage:
      description: Any message the server may send.
      oneOf:
        - $ref: "#/components/schemas/WsMessageStart"
        - $ref: "#/components/schemas/WsMessageDelta"
        - $ref: "#/components/schemas/WsToolCall"
        - $ref: "#/components/schemas/WsToolResult"
        - $ref: "#/components/schemas/WsMessageEnd"
        - $ref: "#/components/schemas/WsError"
        - $ref: "#/components/schemas/WsPong"
      discriminator:
        propertyName: type
        mapping:
          message.start: "#/components/schemas/WsMessageStart"
          message.delta: "#/components/schemas/WsMessageDelta"
          tool.call: "#/components/schemas/WsToolCall"
          tool.result: "#/components/schemas/WsToolResult"
          message.end: "#/components/schemas/WsMessageEnd"
          error: "#/components/schemas/WsError"
          pong: "#/components/schemas/WsPong"
